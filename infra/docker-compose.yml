services:
  db:
    image: postgres:16
    container_name: coffee_menu_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: coffee_menu
    volumes:
      - coffee_menu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d coffee_menu"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    container_name: coffee_menu_backend
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/coffee_menu
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: coffee_menu_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  coffee_menu_pgdata:
  uploads_data: